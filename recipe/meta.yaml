{% set name = "vowpalwabbit" %}
{% set version = "9.11.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/VowpalWabbit/vowpal_wabbit/archive/refs/tags/{{ version }}.tar.gz
  sha256: 21352230bf0e4c01fb4da1959a7338e21a3150ca5641eb2328abfc749fd32e77
  patches:
    - patches/0001-Use-system-dependencies.patch
    - patches/0002-System-ensmallen-and-armadillo.patch

build:
  number: 0
  # Windows is skipped due to conflicting intel-openmp requirements
  # between armadillo 12.6.6 and ensmallen 2.20.0.
  skip: true  # [win or py<310]
  script_env:
    - CMAKE_GENERATOR=Ninja
  script:
    - {{ PYTHON }} -m pip install . -v --no-deps --no-build-isolation
  ignore_run_exports:
    # spdlog is used in header only mode.
    # See https://github.com/VowpalWabbit/vowpal_wabbit/blob/122bae254a5b8bc2b774d13b33d53e6dbc2cfba7/ext_libs/ext_libs.cmake#L23
    - spdlog
    # Armadillo is used in header only mode
    - armadillo
    # Boost.Math is used through headers without dynamic linking to libboost.
    - libboost

requirements:
  build:
    - cmake >=3.13
    - ninja-base
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - pip
    - python
    - libboost-devel {{ libboost_devel }}
    - pybind11
    - pybind11-abi
    - zlib {{ zlib }}
    - spdlog 1.15.3
    - rapidjson 1.1.0
    - fmt 11.2.0
    - eigen 3.4.0
    # System dependencies used by upstream CMake.
    # https://github.com/VowpalWabbit/vowpal_wabbit/blob/9.11.2/ext_libs/ext_libs.cmake#L152-L157
    - armadillo {{ armadillo }}
    - ensmallen 2.20.0
    - sse2neon 1.6.0  # [(osx and arm64) or (linux and aarch64)]
    - setuptools
    - wheel
  run:
    - python
    - zlib
    - {{ pin_compatible('rapidjson') }}

test:
  source_files:
    - python
    - test
  imports:
    - vowpalwabbit
  commands:
    - pip check
    # Exclude test_ccb_and_automl (requires vw_executor) and e2e_v2
    # (excluded upstream due to multiprocessing hangs with pybind11 in CI).
    - python -m pytest -v python/tests/ --ignore=python/tests/e2e_v2 -k "not test_ccb_and_automl"
  requires:
    - pip
    - pytest
    - pandas
    - numpy
    - scipy
    - scikit-learn

about:
  home: https://vowpalwabbit.org/
  summary: Vowpal Wabbit is a machine learning system which pushes the frontier of machine learning with techniques such as online, hashing, allreduce, reductions, learning2search, active, and interactive learning.
  description: |
    Vowpal Wabbit is a machine learning system which pushes the frontier of machine learning with
    techniques such as online, hashing, allreduce, reductions, learning2search, active, and interactive
    learning. There is a specific focus on reinforcement learning with several contextual bandit
    algorithms implemented and the online nature lending to the problem well. Vowpal Wabbit is a
    destination for implementing and maturing state of the art algorithms with performance in mind.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  dev_url: https://github.com/VowpalWabbit/vowpal_wabbit
  doc_url: https://vowpalwabbit.org/docs/vowpal_wabbit/python/latest/index.html

extra:
  recipe-maintainers:
    - jackgerrits
    - gramhagen
    - xhochy
    - ngam
    - byronxu99
